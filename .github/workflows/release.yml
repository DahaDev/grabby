# Builds and publishes grabby installers when a release tag is pushed.
#
# How to use:
#   1. Bump version in package.json (e.g. 0.1.0 -> 0.1.1)
#   2. git commit -am "Release v0.1.1"
#   3. git tag v0.1.1
#   4. git push && git push --tags
#
# GitHub Actions will then build for macOS (Intel + Apple Silicon) and Windows
# in parallel, then attach the installers to a GitHub Release with the same tag.
# Users with the app installed will auto-update from that release on next launch.

name: Release

on:
  push:
    tags:
      - 'v*'        # only run on version tags
  workflow_dispatch:  # also allow manual triggering from the Actions tab

permissions:
  contents: write   # needed to create/update releases

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python (for icon regeneration if needed)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm install
        env:
          # Use a faster mirror for the Electron binary in CI.
          ELECTRON_MIRROR: 'https://npmmirror.com/mirrors/electron/'

      - name: Verify binaries downloaded
        shell: bash
        run: |
          ls -la vendor/
          # The postinstall script should have populated vendor/<platform>/
          # If it didn't, fail loudly here rather than during electron-builder.

      - name: Build and publish (macOS)
        if: matrix.os == 'macos-latest'
        run: npm run publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code-signing & notarization for the Mac build.
          # electron-builder reads these env vars automatically; if any are
          # missing the build still succeeds but produces an unsigned app.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build and publish (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Windows certificate yet — ships unsigned. To add later,
          # uncomment these and add WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD secrets.
          # CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts (for debugging if needed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: ignore
          retention-days: 7
